# CI - epy_export (public, MIT).
# The shared engine of the ePy document family. Five applications pin it
# by tag and install it from this repository, so a change here reaches
# all of them at once: this is the one repository in the family whose CI
# is not about itself.
name: CI

on:
  # Manual runs: a self-hosted runner can miss a queued
  # assignment, and a dispatch relaunches the same HEAD.
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: [self-hosted, Linux, X64, epy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # Its post-step rewrites .git/config and wedges on this runner.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the job venv
        # Ubuntu 24.04 has no `python` alias and its system pip is externally
        # managed (PEP 668), so every install below targets this venv.
        run: |
          P="$(command -v python || command -v python3)"
          "$P" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the local suite mirrors
        # Self-hosted only: $HOME/epy-mirrors holds full bare clones, so pip's
        # git+ specs resolve locally instead of re-cloning the suite per job.
        # A failed fetch stops the job: a stale mirror would lie about main.
        run: |
          MIRRORS="$HOME/epy-mirrors"
          if [ ! -d "$MIRRORS" ]; then
            echo "no local mirrors; installing from GitHub"
            exit 0
          fi
          REPOS="epy_suite epy_units epy_export epy_analysis epy_plotter epy_docs epy_concrete epy_steel epy_timber epy_masonry epy_geotechnical epy_project epy_bridges epy_houses epy_tanks epy_tall epy_structure epy_buildings epy_towers"
          for repo in $REPOS; do
            git config --global --unset-all "url.$MIRRORS/$repo.git.insteadOf" || true
          done
          for repo in $REPOS; do
            git -C "$MIRRORS/$repo.git" fetch origin \
              "+refs/heads/main:refs/heads/main" "+refs/tags/*:refs/tags/*" \
              || { echo "mirror refresh failed: $repo"; exit 1; }
          done
          for repo in $REPOS; do
            git config --global --replace-all "url.$MIRRORS/$repo.git.insteadOf" \
              "https://github.com/estructuraPy/$repo.git"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: ruff check
        run: ruff check .

  typecheck:
    name: Typecheck (pyright)
    runs-on: [self-hosted, Linux, X64, epy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # Its post-step rewrites .git/config and wedges on this runner.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the job venv
        # Ubuntu 24.04 has no `python` alias and its system pip is externally
        # managed (PEP 668), so every install below targets this venv.
        run: |
          P="$(command -v python || command -v python3)"
          "$P" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the local suite mirrors
        # Self-hosted only: $HOME/epy-mirrors holds full bare clones, so pip's
        # git+ specs resolve locally instead of re-cloning the suite per job.
        # A failed fetch stops the job: a stale mirror would lie about main.
        run: |
          MIRRORS="$HOME/epy-mirrors"
          if [ ! -d "$MIRRORS" ]; then
            echo "no local mirrors; installing from GitHub"
            exit 0
          fi
          REPOS="epy_suite epy_units epy_export epy_analysis epy_plotter epy_docs epy_concrete epy_steel epy_timber epy_masonry epy_geotechnical epy_project epy_bridges epy_houses epy_tanks epy_tall epy_structure epy_buildings epy_towers"
          for repo in $REPOS; do
            git config --global --unset-all "url.$MIRRORS/$repo.git.insteadOf" || true
          done
          for repo in $REPOS; do
            git -C "$MIRRORS/$repo.git" fetch origin \
              "+refs/heads/main:refs/heads/main" "+refs/tags/*:refs/tags/*" \
              || { echo "mirror refresh failed: $repo"; exit 1; }
          done
          for repo in $REPOS; do
            git config --global --replace-all "url.$MIRRORS/$repo.git.insteadOf" \
              "https://github.com/estructuraPy/$repo.git"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
      # Every extra, not just dev: pyright resolves imports against what
      # is installed, and this tree imports pypdf, reportlab, Pillow and
      # PySide6 behind extras. With a thinner install the job would fail
      # on unresolved imports that are not type errors at all.
      - name: Install package + every extra
        run: pip install -e ".[dev,pdf,qt]"
      - name: Install pyright
        run: npm install -g pyright
      # pyrightconfig.json pins pythonPlatform to Windows so this job and
      # a developer's local run evaluate the same configuration.
      - name: pyright
        run: pyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: [self-hosted, Linux, X64, epy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # Its post-step rewrites .git/config and wedges on this runner.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create the job venv
        # Ubuntu 24.04 has no `python` alias and its system pip is externally
        # managed (PEP 668), so every install below targets this venv.
        run: |
          P="$(command -v python || command -v python3)"
          "$P" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the local suite mirrors
        # Self-hosted only: $HOME/epy-mirrors holds full bare clones, so pip's
        # git+ specs resolve locally instead of re-cloning the suite per job.
        # A failed fetch stops the job: a stale mirror would lie about main.
        run: |
          MIRRORS="$HOME/epy-mirrors"
          if [ ! -d "$MIRRORS" ]; then
            echo "no local mirrors; installing from GitHub"
            exit 0
          fi
          REPOS="epy_suite epy_units epy_export epy_analysis epy_plotter epy_docs epy_concrete epy_steel epy_timber epy_masonry epy_geotechnical epy_project epy_bridges epy_houses epy_tanks epy_tall epy_structure epy_buildings epy_towers"
          for repo in $REPOS; do
            git config --global --unset-all "url.$MIRRORS/$repo.git.insteadOf" || true
          done
          for repo in $REPOS; do
            git -C "$MIRRORS/$repo.git" fetch origin \
              "+refs/heads/main:refs/heads/main" "+refs/tags/*:refs/tags/*" \
              || { echo "mirror refresh failed: $repo"; exit 1; }
          done
          for repo in $REPOS; do
            git config --global --replace-all "url.$MIRRORS/$repo.git.insteadOf" \
              "https://github.com/estructuraPy/$repo.git"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
      # The Qt print path is tested against a fake page, but importing
      # PySide6 at all needs these on a headless runner.
      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Install the peer extras this repo declares
        # Every extra naming a suite repository (deploy, suite, simulation,
        # ...) is a PEER the tests import; installing the package alone does not
        # pull them, and collection then fails. The git URLs resolve to the
        # mirrors. ifcopenshell is pulled only when the tests mention it.
        shell: bash
        run: |
          set -e
          if grep -qs "ifcopenshell" -r tests; then
            python -m pip install ifcopenshell
          fi
          SPECS=$(grep -oE '"epy[_-][A-Za-z0-9_-]+ @ git\+https://github\.com/estructuraPy/[A-Za-z0-9_.-]+"' pyproject.toml || true)
          printf '%s\n' "$SPECS" | tr -d '"' | sort -u | while IFS= read -r spec; do
            [ -n "$spec" ] && python -m pip install "$spec"
          done
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q

  consumers:
    name: The applications still import what they were promised
    needs: [test]
    runs-on: [self-hosted, Linux, X64, epy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # Its post-step rewrites .git/config and wedges on this runner.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the job venv
        # Ubuntu 24.04 has no `python` alias and its system pip is externally
        # managed (PEP 668), so every install below targets this venv.
        run: |
          P="$(command -v python || command -v python3)"
          "$P" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the local suite mirrors
        # Self-hosted only: $HOME/epy-mirrors holds full bare clones, so pip's
        # git+ specs resolve locally instead of re-cloning the suite per job.
        # A failed fetch stops the job: a stale mirror would lie about main.
        run: |
          MIRRORS="$HOME/epy-mirrors"
          if [ ! -d "$MIRRORS" ]; then
            echo "no local mirrors; installing from GitHub"
            exit 0
          fi
          REPOS="epy_suite epy_units epy_export epy_analysis epy_plotter epy_docs epy_concrete epy_steel epy_timber epy_masonry epy_geotechnical epy_project epy_bridges epy_houses epy_tanks epy_tall epy_structure epy_buildings epy_towers"
          for repo in $REPOS; do
            git config --global --unset-all "url.$MIRRORS/$repo.git.insteadOf" || true
          done
          for repo in $REPOS; do
            git -C "$MIRRORS/$repo.git" fetch origin \
              "+refs/heads/main:refs/heads/main" "+refs/tags/*:refs/tags/*" \
              || { echo "mirror refresh failed: $repo"; exit 1; }
          done
          for repo in $REPOS; do
            git config --global --replace-all "url.$MIRRORS/$repo.git.insteadOf" \
              "https://github.com/estructuraPy/$repo.git"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install package + dev deps
        run: pip install -e ".[dev,pdf,qt]"
      # This library is a promise to five applications that pin it by
      # tag. Removing or renaming a public name is what breaks them, and
      # it breaks them at THEIR next install, not here -- so the surface
      # is asserted here, where the change is made.
      - name: Install the peer extras this repo declares
        # Every extra naming a suite repository (deploy, suite, simulation,
        # ...) is a PEER the tests import; installing the package alone does not
        # pull them, and collection then fails. The git URLs resolve to the
        # mirrors. ifcopenshell is pulled only when the tests mention it.
        shell: bash
        run: |
          set -e
          if grep -qs "ifcopenshell" -r tests; then
            python -m pip install ifcopenshell
          fi
          SPECS=$(grep -oE '"epy[_-][A-Za-z0-9_-]+ @ git\+https://github\.com/estructuraPy/[A-Za-z0-9_.-]+"' pyproject.toml || true)
          printf '%s\n' "$SPECS" | tr -d '"' | sort -u | while IFS= read -r spec; do
            [ -n "$spec" ] && python -m pip install "$spec"
          done
      - name: Every promised name is importable
        run: |
          python - <<'PY'
          import epy_export

          promised = {
              "ORGANIZATION", "LEGACY_ORGANIZATIONS",
              "parse_front_matter", "strip_front_matter",
              "parse_header_cells", "set_metadata_field", "is_truthy",
              "write_text_atomic", "pin_system_icu",
              "add_footer", "add_header", "add_metadata",
              "add_page_background", "add_watermark",
              "extract_anchor_pages", "scale_pages_to_width",
              "print_to_pdf", "eval_js", "wait_until", "pump",
              "remove_temp", "render", "available", "installed",
              "understood_by", "engine", "engine_ids", "ENGINES",
              "APPEARANCES", "Engine", "RenderOptions",
              "EngineUnavailableError", "BackendUnavailableError",
              "RenderFailedError", "backend_present", "load_backend",
          }
          missing = sorted(n for n in promised if not hasattr(epy_export, n))
          assert not missing, f"names the applications import are gone: {missing}"
          undeclared = sorted(promised - set(epy_export.__all__))
          assert not undeclared, f"promised but not in __all__: {undeclared}"
          print(f"{len(promised)} promised names present and declared")
          PY

  build:
    name: Build distribution
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, epy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # Its post-step rewrites .git/config and wedges on this runner.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the job venv
        # Ubuntu 24.04 has no `python` alias and its system pip is externally
        # managed (PEP 668), so every install below targets this venv.
        run: |
          P="$(command -v python || command -v python3)"
          "$P" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the local suite mirrors
        # Self-hosted only: $HOME/epy-mirrors holds full bare clones, so pip's
        # git+ specs resolve locally instead of re-cloning the suite per job.
        # A failed fetch stops the job: a stale mirror would lie about main.
        run: |
          MIRRORS="$HOME/epy-mirrors"
          if [ ! -d "$MIRRORS" ]; then
            echo "no local mirrors; installing from GitHub"
            exit 0
          fi
          REPOS="epy_suite epy_units epy_export epy_analysis epy_plotter epy_docs epy_concrete epy_steel epy_timber epy_masonry epy_geotechnical epy_project epy_bridges epy_houses epy_tanks epy_tall epy_structure epy_buildings epy_towers"
          for repo in $REPOS; do
            git config --global --unset-all "url.$MIRRORS/$repo.git.insteadOf" || true
          done
          for repo in $REPOS; do
            git -C "$MIRRORS/$repo.git" fetch origin \
              "+refs/heads/main:refs/heads/main" "+refs/tags/*:refs/tags/*" \
              || { echo "mirror refresh failed: $repo"; exit 1; }
          done
          for repo in $REPOS; do
            git config --global --replace-all "url.$MIRRORS/$repo.git.insteadOf" \
              "https://github.com/estructuraPy/$repo.git"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install build
        run: pip install build
      - name: Build sdist + wheel
        run: pyproject-build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
